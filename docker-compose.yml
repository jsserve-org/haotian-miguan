# 好甜的蜜罐 — direct deployment (image from GitHub Packages)
#   docker compose up -d
#   docker compose pull && docker compose up -d   # upgrade to the latest build
#
# Behind your own nginx reverse proxy? Use docker-compose.proxy.yml instead.

services:
  haotian-miguan:
    image: ghcr.io/jsserve-org/haotian-miguan:latest
    container_name: haotian-miguan
    restart: unless-stopped
    ports:
      - "1984:1984"   # fake go2rtc HTTP API + old WebUI
      - "8554:8554"    # fake RTSP
    volumes:
      - honeypot_data:/data
    environment:
      - TZ=UTC
    # hardening: the honeypot only needs to speak TCP and write to /data
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ---- optional: local catch dashboard -------------------------------------
  # Shows what attackers tried to apply (payloads, planted streams), live.
  # Localhost-only by default: http://127.0.0.1:8080
  # Remove this service (or the ports mapping) if you don't want it.
  dashboard:
    image: ghcr.io/jsserve-org/haotian-miguan:latest
    container_name: haotian-dashboard
    restart: unless-stopped
    command:
      - "python3"
      - "dashboard.py"
      - "--data-dir"
      - "/data"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"      # never expose this beyond localhost
    volumes:
      - honeypot_data:/data
    # the image healthcheck probes the pot's port — give this service its own
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  honeypot_data:
