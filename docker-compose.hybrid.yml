# 好甜的蜜罐 — HYBRID mode: the dangerous half of your REAL go2rtc
#   docker compose -f docker-compose.hybrid.yml up -d
#
# Architecture: the public hostname keeps serving your real go2rtc for
# everything a viewer needs (index, links, stream playback, /api info),
# while nginx routes the attacker surface to this pot:
#
#     /api/config  /api/restart  /api/exit  /api/log
#     /api/streams (mutations + merged listing)   /api/webrtc
#
# UI pages are NOT routed to the pot: the real instance serves its own
# (modern 1.9.x config.html/net.html/… or old 1.8.x editor.html/…), and the
# pot supplies the data behind /api/config, /api/streams and /api/log — so
# the interface matches your real version exactly.
#
# Media (frame.jpeg, stream.mjpeg, stream.mp4, frame.mp4, stream.m3u8,
# segment.ts) is NOT pot-first: viewers use those paths, so nginx sends
# them to the REAL instance and only hands over what it 404s ("stream not
# found" = something an attacker planted). Users never touch the pot here.
#
# The pot makes the seam invisible:
#   - auto-seeds its fake go2rtc.yaml from the real instance's stream list
#     (credentials replaced — attackers can never harvest real passwords)
#   - adopts the real version number for its fake log lines
#   - /api/streams returns the real streams PLUS anything an attacker
#     planted (after their fake "restart"), minus anything they "deleted"
#   - viewing a planted stream serves the fake camera frame — the exact
#     moment a real go2rtc would execute their ffmpeg #command
#   - viewing a real stream never leaves the real instance
#     (and /api/webrtc for a real stream is relayed upstream untouched)
#
# nginx side (drop-in for the vhost that currently returns
# `200 "no thank you"` — see README "Hybrid" section):
#
#   # control surface → the pot
#   location ~ ^/api/(config|restart|exit|log|streams|webrtc)$ {
#       proxy_pass http://172.17.0.1:19840;   # the pot
#       ... same proxy headers as your real location block ...
#   }
#   # media → the REAL instance first; its 404 goes to the pot
#   location ~ ^/api/(frame\.jpeg|stream\.mjpeg|stream\.mp4|frame\.mp4|stream\.m3u8|segment\.ts)$ {
#       proxy_pass http://172.17.0.1:1984;
#       ... same proxy headers ...
#       proxy_intercept_errors on;
#       error_page 404 = @potmedia;
#   }
#   location @potmedia { proxy_pass http://172.17.0.1:19840; ... }
#   location / { proxy_pass http://172.17.0.1:1984; ... }   # the real one
#
# Note: no page routing — the real instance serves all its UI pages
# (a 1.9.x real serves config.html/net.html, not the old editor.html).

services:
  haotian-miguan:
    image: ghcr.io/jsserve-org/haotian-miguan:latest
    container_name: haotian-miguan
    restart: unless-stopped
    ports:
      # bridge-IP only: reachable by nginx, invisible to the internet
      - "172.17.0.1:19840:1984"
      # NO RTSP mapping — the real instance owns :8554 and its RTSP keeps
      # serving real SDP/video, which makes the whole hostname consistent
    volumes:
      - honeypot_data:/data
    environment:
      - TZ=UTC
    command:
      # replaces the Dockerfile CMD — keep the essentials and add the flags
      - "python3"
      - "honeypot.py"
      - "--host"
      - "0.0.0.0"
      - "--data-dir"
      - "/data"
      - "--upstream"
      - "http://172.17.0.1:1984"   # your REAL go2rtc
      - "--trust-proxy"            # evidence IPs from X-Real-IP (set by nginx)
      - "--rtsp-port"
      - "0"                        # the real instance owns RTSP
      - "--version-string"
      - "1.9.15"                   # match your real instance (auto-adopted when reachable)
      - "--revision"
      - "7c05066"                  # your real build revision (auto-adopted too)
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ---- optional: local catch dashboard -------------------------------------
  # Shows what attackers tried to apply (payloads, planted streams), live.
  # Localhost-only by default: http://127.0.0.1:8080
  # Remove this service (or the ports mapping) if you don't want it.
  dashboard:
    image: ghcr.io/jsserve-org/haotian-miguan:latest
    container_name: haotian-dashboard
    restart: unless-stopped
    command:
      - "python3"
      - "dashboard.py"
      - "--data-dir"
      - "/data"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"      # never expose this beyond localhost
    volumes:
      - honeypot_data:/data
    # the image healthcheck probes the pot's port — give this service its own
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  honeypot_data:
