# fail2ban filter for 好甜的蜜罐 (好甜的蜜罐)
# /etc/fail2ban/filter.d/haotian-miguan.conf
#
# matches the plain-text alert log written by the honeypot:
#   2026-11-19T07:09:41Z severity=high ip=203.0.113.7 tags=config_write,ffmpeg_rce method=POST path=/api/config
#
# Default jail (see jail.local snippet) bans on any medium/high alert.

[Definition]
failregex = ^.* severity=(?:medium|high) ip=<HOST> tags=
ignoreregex =

datepattern = {^LN-BEG}%%Y-%%m-%%dT%%H:%%M:%%SZ
