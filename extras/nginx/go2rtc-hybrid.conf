# 好甜的蜜罐 — hybrid nginx vhost (full config)
#
# The public go2rtc hostname serves your REAL instance, while the attack
# surface (config apply, editor, stream planting, log, exit) is answered by
# the honeypot pot on 172.17.0.1:19840.
#
# This REPLACES, in your existing vhost:
#   location = /api/config  { default_type text/plain; return 200 "no thank you"; }
#   location = /api/restart { default_type text/plain; return 200 "no thank you"; }
#   location = /editor.html { return 307 "https://yhw.tw/home?no_audio=1"; }
#   location = /add.html    { return 307 "https://yhw.tw/home?no_audio=1"; }
#   location = /log.html    { return 307 "https://yhw.tw/home?no_audio=1"; }
# Those protections belong on a hardened real instance; on the DECOY surface
# the trap must stay open. /api/log and /api/exit were not blocked before —
# they are now answered by the pot instead of your real instance (which also
# removes a log-leak and a remote-exit DoS from the real one).
#
# Requirements:
#   - the pot running:   docker compose -f docker-compose.hybrid.yml up -d
#     (binds 172.17.0.1:19840, --upstream http://172.17.0.1:1984, --trust-proxy)
#   - your real go2rtc still on 172.17.0.1:1984
#
# Routing in one line: control endpoints -> pot, media -> real first with
# the pot as the 404 fallback, everything else -> real.

# Maps live in the http{} context. This one is already in your config (from
# the go2rtc vhost) — keep exactly ONE copy of it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # default_server also catches bare-IP / unmatched-Host scans — good for a
    # honeypot. Remove the flag (or point another vhost at default) if your
    # go2rtc vhost must not be the catch-all for this port.
    listen 80 default_server;

    # your go2rtc hostname (use the name that currently points at this vhost)
    server_name cam.example.com;

    # attacker payloads must reach the pot (nginx default is 1m)
    client_max_body_size 16m;

    # ---------------------------------------------------------------- #
    #  the honeypot half — control + config (serves viewers nothing)   #
    # ---------------------------------------------------------------- #
    location ~ ^/api/(config|restart|exit|log|streams|webrtc)$ {
        proxy_pass http://172.17.0.1:19840;              # the pot
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;         # evidence IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # NOTE: no page routing here. The REAL instance serves its own UI —
    # including the modern 1.9.x pages (config.html, net.html, add.html,
    # log.html, schema.json…) — and the pot supplies the data behind
    # /api/config, /api/streams, /api/log. That keeps the UI looking
    # exactly like your real version, whatever era it is. (Routing old
    # 1.8.x page names to the pot would betray a 1.9.x real instance.)

    # ---------------------------------------------------------------- #
    #  media — YOUR VIEWERS go straight to the real instance. Only the #
    #  real instance's 404 ("stream not found" = something an attacker #
    #  planted) is handed to the pot. Everything else — 200s, 206 Range #
    #  responses, the Safari stream.mp4 -> stream.m3u8 redirect — passes#
    #  through untouched. Users never depend on the pot here.          #
    # ---------------------------------------------------------------- #
    location ~ ^/api/(frame\.jpeg|stream\.mjpeg|stream\.mp4|frame\.mp4|stream\.m3u8|segment\.ts)$ {
        proxy_pass http://172.17.0.1:1984;               # real go2rtc first
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;

        proxy_intercept_errors on;
        error_page 404 = @potmedia;                      # unknown stream -> the pot
    }

    location @potmedia {
        proxy_pass http://172.17.0.1:19840;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ---------------------------------------------------------------- #
    #  the viewer half — the REAL go2rtc: UI, /api, /api/ws, everything #
    #  not claimed above (including WebSocket playback)                #
    # ---------------------------------------------------------------- #
    location / {
        proxy_pass http://172.17.0.1:1984;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
}

# RTSP is not proxied here (nginx http{} cannot speak RTSP). Your real
# instance keeps serving :8554 exactly as it does today. If you ever want
# the decoy's RTSP on the classic port, use nginx's stream{} block — but the
# real instance answering RTSP is the more consistent illusion.
